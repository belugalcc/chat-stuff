<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<meta name="theme-color" content="#5865f2" />
	<meta name="description" content="lcc-chat — a place to talk, message, and call together." />
	<title>lcc-chat</title>
	<link href="style.css" rel="stylesheet" />
</head>
<body>
	<section class="onboarding" id="onboarding">
		<div class="auth-card">
			<div class="mark">lcc</div>
			<p class="eyebrow">WELCOME TO</p>
			<h1>lcc-chat</h1>
			<p>Choose a name and join the conversation. Add a password to keep your account.</p>
			<form id="auth-form">
				<label>Display name<input id="display-name" maxlength="32" placeholder="How people will see you" required autocomplete="nickname" /></label>
				<label>Username<input id="username" maxlength="24" placeholder="your-name" required autocomplete="username" /></label>
				<label>Password <span>optional</span><input id="password" type="password" placeholder="Leave blank for a temporary account" autocomplete="new-password" /></label>
				<p class="temporary-note">Password-free accounts are automatically removed after 24 hours.</p>
				<p class="auth-error" id="auth-error" role="alert"></p>
				<button class="primary" type="submit">Enter lcc-chat</button>
			</form>
		</div>
	</section>

	<main class="app" id="app" hidden>
		<aside class="rail"><div class="server active">lcc</div></aside>
		<aside class="sidebar">
			<div class="workspace"><strong>lcc-chat</strong><span>⌄</span></div>
			<nav>
				<button class="channel selected" data-channel="central"><span>#</span> central-chat</button>
				<button class="channel" data-channel="call"><span>◉</span> central-call</button>
			</nav>
			<div class="direct-heading"><span>DIRECT MESSAGES</span><button id="new-dm" title="New direct message">+</button></div>
			<form class="dm-form" id="dm-form" hidden><input id="dm-username" placeholder="Username to message" maxlength="24" /><button type="submit">Message</button></form>
			<div class="dm-list" id="dm-list"></div>
			<div class="profile"><div class="avatar" id="me-avatar"></div><div><strong id="me-name"></strong><small id="me-tag"></small></div><button id="logout" title="Sign out">↪</button></div>
		</aside>
		<section class="chat-shell">
			<header class="chat-header"><div><span id="header-icon">#</span><strong id="channel-title">central-chat</strong><small id="channel-subtitle">Everyone in lcc-chat can talk here</small></div><div class="header-actions"><button id="admin-button" hidden>Admin</button><span id="online-count"></span></div></header>
			<div class="messages" id="messages"></div>
			<form class="composer" id="composer"><textarea id="message-input" placeholder="Message #central-chat" rows="1" maxlength="2000"></textarea><button class="primary" type="submit">Send</button></form>
		</section>
		<aside class="members"><h2>ONLINE — <span id="member-count">0</span></h2><div id="member-list"></div></aside>
	</main>
	<dialog id="admin-dialog"><form method="dialog" class="admin-card"><button class="close" value="close">×</button><p class="eyebrow">ADMIN CONSOLE</p><h2>lcc-chat overview</h2><p id="admin-summary"></p><div id="account-list"></div><hr><label>Change a user password<input id="admin-user" placeholder="username" /></label><label>New password<input id="admin-password" type="password" /></label><button class="primary" id="update-password" value="default">Update password</button></form></dialog>
	<div class="toast" id="toast"></div>
	<script type="module" src="app.js"></script>
</body>
</html>
